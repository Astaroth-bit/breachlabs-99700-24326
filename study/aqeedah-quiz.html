E\u0651\u0647\u064E\uFD3E.","\u201CWe sent into every nation a messenger: worship Allah.\u201D")},{id:"L1-16",l:1,t:"mcq",q:c("\u0645\u0627 \u0627\u0644\u062D\u0643\u0645\u0629 \u0645\u0646 \u062A\u0639\u062F\u062F \u0627\u0644\u0631\u0633\u0627\u0644\u0627\u062A \u0627\u0644\u0633\u0645\u0627\u0648\u064A\u0629\u061F","What is the wisdom of multiple heavenly messages?"),o:[c("\u062C\u0627\u0621\u062A \u0641\u064A \u0645\u0631\u0627\u062D\u0644 \u0646\u0645\u0648 \u0627\u0644\u0628\u0634\u0631\u064A\u0629 \u0628\u0645\u0627 \u064A\u0646\u0627\u0633\u0628 \u0643\u0644 \u0645\u0631\u062D\u0644\u0629\u060C \u0645\u062A\u0643\u0627\u0645\u0644\u0629 \u0645\u062A\u0648\u0627\u0641\u0642\u0629","They came in stages of humanity\u2019s growth to suit each stage, complementary and harmonious"),c("\u0644\u0623\u0646 \u0643\u0644 \u0631\u0633\u0627\u0644\u0629 \u0623\u0644\u063A\u062A \u0645\u0627 \u0642\u0628\u0644\u0647\u0627","Because each cancelled the one before"),c("\u0644\u0623\u0646 \u0627\u0644\u0644\u0647 \u0644\u0645 \u064A\u0639\u0644\u0645 \u062D\u0627\u062C\u0627\u062A \u0627\u0644\u0646\u0627\u0633","Because Allah did not know people\u2019s needs"),c("\u0644\u0644\u062A\u0646\u0627\u0641\u0633 \u0628\u064A\u0646 \u0627\u0644\u0623\u0645\u0645","For competition between nations")],a:0,w:c("\u0627\u0644\u062A\u0639\u062F\u062F \u062F\u0644\u064A\u0644 \u0623\u062E\u0648\u0629 \u0627\u0644\u0625\u064A\u0645\u0627\u0646 \u0628\u0627\u0644\u0644\u0647 \u0627\u0644\u062A\u064A \u062A\u062C\u0645\u0639 \u0627\u0644\u0628\u0634\u0631\u064A\u0629.","The plurality shows the brotherhood of faith in Allah that unites humanity.")},{id:"L1-17",l:1,t:"multi",q:c("\u0645\u0646 \u0645\u0645\u064A\u0632\u0627\u062A \u0631\u0633\u0627\u0644\u0629 \u0645\u062D\u0645\u062F \uFDFA (\u0627\u062E\u062A\u0631 \u0663):","Features of Muhammad\u2019s \uFDFA message (choose 3):"),o:[c("\u0639\u0627\u0645\u0629 \u0644\u062C\u0645\u064A\u0639 \u0627\u0644\u0628\u0634\u0631","Universal for all people"),c("\u062E\u0627\u0644\u062F\u0629 \u0644\u0627 \u0631\u0633\u0627\u0644\u0629 \u0628\u0639\u062F\u0647\u0627","Eternal; no message after it"),c("\u0634\u0631\u064A\u0639\u062A\u0647\u0627 \u0635\u0627\u0644\u062D\u0629 \u0644\u0643\u0644 \u0632\u0645\u0627\u0646 \u0648\u0645\u0643\u0627\u0646","Its law suits every time and place"),c("\u062E\u0627\u0635\u0629 \u0628\u0627\u0644\u0639\u0631\u0628","For the Arabs only")],a:[0,1,2],w:c("\u0647\u064A \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0627\u0644\u062E\u0627\u062A\u0645\u0629.","It is the final message.")},{id:"L1-18",l:1,t:"tf",q:c("\u0631\u0633\u0627\u0644\u0629 \u0645\u062D\u0645\u062F \uFDFA \u062E\u0627\u0635\u0629 \u0628\u0627\u0644\u0639\u0631\u0628 \u0648\u062D\u062F\u0647\u0645.","Muhammad\u2019s \uFDFA message is for the Arabs only."),a:!1,w:c("\u0647\u064A \u0639\u0627\u0645\u0629 \u0644\u062C\u0645\u064A\u0639 \u0627\u0644\u0628\u0634\u0631.","It is universal for all people.")},{id:"L1-19",l:1,t:"mcq",q:c("\u0645\u0627\u0630\u0627 \u062A\u062B\u0628\u062A \u0627\u0644\u0622\u064A\u0629 \uFD3F\u0648\u064E\u062E\u064E\u0627\u062A\u064E\u0645\u064E \u0671\u0644\u0646\u064E\u0651\u0628\u0650\u064A\u0650\u0651\u0640\u06E7\u0646\u064E\uFD3E (\u0627\u0644\u0623\u062D\u0632\u0627\u0628 \u0664\u0660)\u061F","What does \u201C\u2026and the Seal of the Prophets\u201D (33:40) establish?"),o:[c("\u0644\u0627 \u0646\u0628\u064A \u0628\u0639\u062F \u0645\u062D\u0645\u062F \uFDFA","No prophet after Muhammad \uFDFA"),c("\u0623\u0646 \u0627\u0644\u0623\u0646\u0628\u064A\u0627\u0621 \u0643\u062B\u064A\u0631\u0648\u0646","That prophets are many"),c("\u0623\u0646 \u0627\u0644\u0625\u0633\u0644\u0627\u0645 \u062C\u062F\u064A\u062F","That Islam is new"),c("\u0623\u0646 \u0644\u0643\u0644 \u0623\u0645\u0629 \u0646\u0628\u064A\u064B\u0627 \u0627\u0644\u064A\u0648\u0645","That every nation has a prophet today")],a:0,w:c("\u0627\u0644\u062E\u0627\u062A\u0645: \u0645\u0646 \u064A\u064F\u062E\u062A\u0645 \u0628\u0647.","Seal = the one with whom it is ended.")},{id:"L1-20",l:1,t:"mcq",q:c("\uFD3F\u0671\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u064E \u0623\u064E\u0643\u0652\u0645\u064E\u0644\u0652\u062A\u064F \u0644\u064E\u0643\u064F\u0645\u0652 \u062F\u0650\u064A\u0646\u064E\u0643\u064F\u0645\u0652\uFD3E (\u0627\u0644\u0645\u0627\u0626\u062F\u0629 \u0663) \u062A\u062F\u0644 \u0639\u0644\u0649:","\u201CToday I have perfected for you your religion\u201D (5:3) indicates:"),o:[c("\u0627\u0643\u062A\u0645\u0627\u0644 \u0627\u0644\u062F\u064A\u0646 \u0628\u0631\u0633\u0627\u0644\u0629 \u0645\u062D\u0645\u062F \uFDFA","The religion was completed by Muhammad\u2019s \uFDFA message"),c("\u0646\u0642\u0635 \u0627\u0644\u062F\u064A\u0646","The religion is lacking"),c("\u0646\u0633\u062E \u0627\u0644\u062A\u0648\u062D\u064A\u062F","Tawhid was abrogated"),c("\u0627\u0646\u062A\u0638\u0627\u0631 \u0646\u0628\u064A \u0622\u062E\u0631","Waiting for another prophet")],a:0,w:c("\u062A\u062F\u0639\u0645 \u0645\u0639\u0646\u0649 \u0627\u0644\u062D\u062F\u064A\u062B: \u0627\u0643\u062A\u0645\u0627\u0644 \u0627\u0644\u0628\u0646\u0627\u0621.","It supports the Hadith\u2019s meaning: the building is complete.")},{id:"L1-21",l:1,t:"cat",q:c("\u0635\u0646\u0651\u0641: \u0647\u0644 \u062A\u062A\u0641\u0642 \u0641\u064A\u0647 \u0627\u0644\u0631\u0633\u0627\u0644\u0627\u062A \u0623\u0645 \u062A\u062E\u062A\u0644\u0641\u061F","Sort: do the messages agree or differ in this?"),cats:[c("\u062A\u062A\u0641\u0642","Agree"),c("\u062A\u062E\u062A\u0644\u0641","Differ")],items:[{p:c("\u062A\u0648\u062D\u064A\u062F \u0627\u0644\u0644\u0647","Tawhid"),c:0},{p:c("\u0645\u0643\u0627\u0631\u0645 \u0627\u0644\u0623\u062E\u0644\u0627\u0642","Noble morals"),c:0},{p:c("\u0627\u0644\u0634\u0631\u064A\u0639\u0629","The Shari\u2018ah"),c:1},{p:c("\u0627\u0644\u0645\u0646\u0647\u0627\u062C","The manhaj"),c:1}],w:c("\u062A\u062A\u0641\u0642 \u0641\u064A \u0627\u0644\u0623\u0635\u0648\u0644 \u0648\u062A\u062E\u062A\u0644\u0641 \u0641\u064A \u0627\u0644\u0641\u0631\u0648\u0639.","Agree in the roots, differ in the branches.")},{id:"L1-22",l:1,t:"short",q:c("\u0648\u0636\u0650\u0651\u062D \u0645\u0627 \u064A\u062F\u0644 \u0639\u0644\u064A\u0647 \u0627\u0644\u062D\u062F\u064A\u062B \u0627\u0644\u0646\u0628\u0648\u064A \u0627\u0644\u0634\u0631\u064A\u0641.","Explain what the noble Hadith indicates."),ans:c("\u064A\u062F\u0644 \u0627\u0644\u062D\u062F\u064A\u062B \u0639\u0644\u0649 \u062A\u0634\u0628\u064A\u0647 \u0631\u0633\u0627\u0644\u0627\u062A \u0627\u0644\u0623\u0646\u0628\u064A\u0627\u0621 \u0627\u0644\u0633\u0627\u0628\u0642\u064A\u0646 \u0628\u0628\u0646\u0627\u0621 \u064A\u062A\u0643\u0627\u0645\u0644 \u0628\u0643\u0644 \u0631\u0633\u0627\u0644\u0629\u060C \u062B\u0645 \u062C\u0627\u0621\u062A \u0627\u0644\u0631\u0633\u0627\u0644\u0629 \u0627\u0644\u062E\u0627\u062A\u0645\u0629 \u0631\u0633\u0627\u0644\u0629 \u0646\u0628\u064A\u0646\u0627 \u0645\u062D\u0645\u062F \uFDFA \u0644\u062A\u0643\u0645\u0644 \u0647\u0630\u0627 \u0627\u0644\u0628\u0646\u0627\u0621 \u0648\u062A\u0643\u0645\u0644 \u0627\u0644\u062F\u064A\u0646 \u0625\u0644\u0649 \u064A\u0648\u0645 \u0627\u0644\u0642\u064A\u0627\u0645\u0629.","The Hadith likens earlier prophets\u2019 messages to a building that grows complete with each message; then the final message, our Prophet Muhammad\u2019s \uFDFA, came to complete it and complete the religion until the Day of Judgement.")},{id:"L1-23",l:1,t:"short",q:c("\u0643\u064A\u0641 \u062A\u0631\u062F \u0639\u0644\u0649 \u0645\u0646 \u064A\u0632\u0639\u0645 \u0623\u0646 \u0627\u0644\u0625\u0633\u0644\u0627\u0645 \u0645\u0646\u0627\u0641 \u0644\u0644\u0634\u0631\u0627\u0626\u0639 \u0627\u0644\u0633\u0627\u0628\u0642\u0629\u061F (\u0625\u062C\u0627\u0628\u0629 \u0645\u0642\u062A\u0631\u062D\u0629)","How do you answer someone who says Islam contradicts earlier laws? (suggested answer)"),ans:c("\u0627\u0644\u0625\u0633\u0644\u0627\u0645 \u0645\u0635\u062F\u0651\u0642 \u0644\u0645\u0627 \u0642\u0628\u0644\u0647 (\u0622\u0644 \u0639\u0645\u0631\u0627\u0646 \u0665\u0660)\u060C \u0648\u0627\u0644\u0631\u0633\u0627\u0644\u0627\u062A \u062A\u062A\u0641\u0642 \u0641\u064A \u0627\u0644\u062A\u0648\u062D\u064A\u062F \u0648\u0645\u0643\u0627\u0631\u0645 \u0627\u0644\u0623\u062E\u0644\u0627\u0642\u060C \u0648\u0627\u0644\u0625\u064A\u0645\u0627\u0646 \u0628\u062C\u0645\u064A\u0639 \u0627\u0644\u0631\u0633\u0644 \u062C\u0632\u0621 \u0645\u0646 \u0639\u0642\u064A\u062F\u062A\u0646\u0627\u060C \u0648\u0627\u0644\u0627\u062E\u062A\u0644\u0627\u0641 \u0641\u064A \u0628\u0639\u0636 \u0627\u0644\u0623\u062D\u0643\u0627\u0645 \u0644\u0627 \u064A\u0639\u0646\u064A \u0627\u0644\u062A\u0646\u0627\u0642\u0636. \u0648\u062D\u0642\u064A\u0642\u0629 \u0627\u0644\u062F\u064A\u0646 \u0627\u0644\u0627\u0633\u062A\u0633\u0644\u0627\u0645 \u0644\u0644\u0647 \u0641\u064A \u0643\u0644 \u0627\u0644\u0631\u0633\u0627\u0644\u0627\u062A.","Islam confirms what came before (3:50); the messages agree in Tawhid and noble morals; belief in all messengers is part of our creed; differences in some rulings are not contradiction; and the essence of religion is submission to Allah in every message.")},{id:"L1-24",l:1,t:"mcq",q:c("\u0644\u0645\u0627\u0630\u0627 \u0642\u0627\u0644 \u0627\u0644\u0646\u0627\u0633: \xAB\u0647\u0644\u0651\u0627 \u0648\u064F\u0636\u0639\u062A \u0647\u0630\u0647 \u0627\u0644\u0644\u0628\u0646\u0629\u061F\xBB","Why did the people say, \u201CIf only this brick were put in place\u201D?"),tag:"hadith",o:[c("\u0631\u0623\u0648\u0627 \u062C\u0645\u0627\u0644 \u0627\u0644\u0628\u0646\u0627\u0621 \u0648\u0634\u0639\u0631\u0648\u0627 \u0628\u0646\u0642\u0635 \u0645\u0648\u0636\u0639 \u0648\u0627\u062D\u062F","They saw the building\u2019s beauty yet felt one place was missing"),c("\u0644\u0623\u0646\u0647\u0645 \u0643\u0631\u0647\u0648\u0627 \u0627\u0644\u0628\u064A\u062A","Because they disliked the house"),c("\u0644\u0623\u0646\u0647\u0645 \u0623\u0631\u0627\u062F\u0648\u0627 \u0647\u062F\u0645\u0647","Because they wanted it demolished"),c("\u0644\u0623\u0646 \u0627\u0644\u0628\u064A\u062A \u0643\u0627\u0646 \u0635\u063A\u064A\u0631\u064B\u0627 \u062C\u062F\u064B\u0627","Because the house was too small")],a:0,w:c("\u0627\u0644\u0625\u0639\u062C\u0627\u0628 \u0645\u0639 \u0627\u0644\u0634\u0639\u0648\u0631 \u0628\u0627\u0644\u062D\u0627\u062C\u0629 \u0625\u0644\u0649 \u0645\u0643\u0645\u0651\u0644.","Admiration mixed with the sense of a need for a completer.")},{id:"L1-25",l:1,t:"tf",q:c("\u062A\u0635\u062F\u064A\u0642 \u0643\u0644 \u0646\u0628\u064A \u0628\u0645\u0646 \u0633\u0628\u0642\u0647 \u064A\u0642\u062A\u0636\u064A \u0627\u0644\u0627\u0628\u062A\u0639\u0627\u062F \u0639\u0646 \u0627\u0644\u0646\u0632\u0627\u0639 \u0628\u064A\u0646 \u0623\u062A\u0628\u0627\u0639 \u0627\u0644\u0623\u0646\u0628\u064A\u0627\u0621.","Each prophet confirming those before him requires staying away from dispute."),a:!0,w:c("\u0627\u0644\u0625\u062E\u0644\u0627\u0644 \u0628\u0630\u0644\u0643 \u0625\u062E\u0644\u0627\u0644 \u0628\u0627\u0644\u0645\u064A\u062B\u0627\u0642 \u0627\u0644\u0630\u064A \u0623\u062E\u0630\u0647 \u0627\u0644\u0644\u0647 \u0639\u0644\u0649 \u0627\u0644\u0646\u0628\u064A\u064A\u0646.","Breaking this breaks the covenant Allah took from the prophets.")},{id:"L1-26",l:1,t:"mcq",q:c("\u0645\u0627 \u0627\u0644\u0630\u064A \u062C\u0645\u0639\u0647 \u0627\u0644\u0646\u0628\u064A \uFDFA \u0641\u064A \u0623\u0633\u0644\u0648\u0628 \xAB\u0627\u0644\u0645\u062B\u0644\xBB \u0628\u062D\u0633\u0628 \u0627\u0644\u0643\u062A\u0627\u0628\u061F","According to the textbook, what does the Prophet\u2019s \uFDFA parable style combine?"),o:[c("\u0625\u064A\u062C\u0627\u0632 \u0627\u0644\u0644\u0641\u0638 \u0648\u0625\u0635\u0627\u0628\u0629 \u0627\u0644\u0645\u0639\u0646\u0649 \u0648\u062D\u0633\u0646 \u0627\u0644\u062A\u0634\u0628\u064A\u0647","Brevity of words, accuracy of meaning, beauty of comparison"),c("\u0627\u0644\u0637\u0648\u0644 \u0648\u0627\u0644\u062A\u
